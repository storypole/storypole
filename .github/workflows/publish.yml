# Publishes @storypole/skill to npm via Trusted Publishing (OIDC).
#
# No npm token exists anywhere: GitHub mints a short-lived credential for this
# run, and npm accepts it only because this repo + this exact filename are
# registered as the package's trusted publisher. Renaming this file breaks
# publishing until the npm setting is updated to match.
#
# Release: bump packages/npm/package.json, then push a matching tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required: this is how the OIDC credential is issued

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"            # trusted publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
