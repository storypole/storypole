# Stages @storypole/skill on npm via Trusted Publishing (OIDC).
#
# No npm token exists anywhere: GitHub mints a short-lived credential for this
# run, and npm accepts it only because this repo, this exact filename, and the
# `release` environment are registered as the package's trusted publisher:
#
#   npx -y npm@11 trust github @storypole/skill --file publish.yml \
#     --repo storypole/storypole --env release --allow-stage-publish
#
# That registration grants stage-publish only. CI can stage a version, but it
# does not become installable until a maintainer approves it with 2FA:
#
#   npm stage list @storypole/skill
#   npm stage approve <stage-id>
#
# Renaming this file, or the job's environment, breaks publishing until the npm
# registration is updated to match.
#
# Release: bump packages/npm/package.json, then push a matching tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required: this is how the OIDC credential is issued

jobs:
  npm:
    runs-on: ubuntu-latest
    # Must match --env on the npm trusted-publisher registration.
    environment: release
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"            # staged publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      # Staged publishing needs npm >= 11.15.0. Pinned to the 11.x line rather
      # than @latest: npm 12 raised its Node floor, so @latest can break on a
      # runner image without any change in this repo.
      - name: Install npm 11
        run: npm install -g npm@11 && npm --version

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Stage for approval
        run: npm stage publish --provenance

      - name: Tell the approver what to do
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### @storypole/skill@${version} staged — not yet live"
            echo
            echo "A maintainer must approve it with 2FA before it can be installed:"
            echo
            echo '```'
            echo "npm stage list @storypole/skill"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
