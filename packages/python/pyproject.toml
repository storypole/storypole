[project]
name = "storypole"
version = "0.1.0"
description = "A shared reference for teams building one prototype: a git-backed feature registry with owner locks, PDLC phase gates, and a generated PRD."
readme = "README.md"
authors = [{ name = "Saurabh Kohli", email = "me.saurabhkohli@gmail.com" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["prd", "feature-registry", "prototype", "pdlc", "agent-skills", "collaboration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
scan = ["playwright>=1.40"]

[project.scripts]
storypole = "storypole.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/storypole/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storypole"]
